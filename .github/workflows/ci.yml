name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check all JavaScript
        run: |
          for f in js/*.js; do node --check "$f"; done

      - name: Compile all Python
        run: python -m py_compile server.py engine.py chem.py auth.py weather.py

      - name: Golden cross-check (chem.py == calc.js)
        run: python test_chem.py
